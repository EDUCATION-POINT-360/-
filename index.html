/* EDUCATION POINT — copy/inspect deterrence
   This only discourages casual copying. It cannot make client-side HTML/JS
   impossible to inspect; real protection comes from Supabase RLS and never
   exposing service-role credentials. */
(function(){
  document.documentElement.classList.add('copy-guard');
  document.addEventListener('contextmenu', function(e){
    if(e.target.closest('input,textarea,select,[contenteditable="true"]')) return;
    e.preventDefault();
  }, {passive:false});
  document.addEventListener('dragstart', function(e){
    if(!e.target.closest('input,textarea,select,[contenteditable="true"]')) e.preventDefault();
  }, {passive:false});
  document.addEventListener('copy', function(e){
    if(e.target.closest && e.target.closest('input,textarea,[contenteditable="true"]')) return;
    e.preventDefault();
  }, {passive:false});
  document.addEventListener('cut', function(e){
    if(e.target.closest && e.target.closest('input,textarea,[contenteditable="true"]')) return;
    e.preventDefault();
  }, {passive:false});
  document.addEventListener('keydown', function(e){
    const k=(e.key||'').toLowerCase();
    const editable=e.target && e.target.closest && e.target.closest('input,textarea,select,[contenteditable="true"]');
    if(editable) return;
    if((e.ctrlKey||e.metaKey) && ['u','s','p','c','x'].includes(k)) e.preventDefault();
    if(e.key==='F12' || (e.ctrlKey && e.shiftKey && ['i','j','c'].includes(k))) e.preventDefault();
  }, {passive:false});
})();
</script>

  if(SUPABASE_READY && supabase) return true;
  if(SUPABASE_LOAD_PROMISE) return SUPABASE_LOAD_PROMISE;

/* ----------------------------------------------------------------
   3. UTILITIES
   ---------------------------------------------------------------- */
function qs(sel, root){ return (root||document).querySelector(sel); }
function qsa(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }
function el(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className = attrs[k];
    else if(k==='html') e.innerHTML = attrs[k];
    else if(k.startsWith('on') && typeof attrs[k]==='function') e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c => { if(typeof c==='string') e.appendChild(document.createTextNode(c)); else if(c) e.appendChild(c); });
  return e;
}
function escapeHTML(str){
  if(str===null||str===undefined) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function safeURL(u){
  if(!u) return '#';
  try{
    const parsed = new URL(u, window.location.origin);
    if(['http:','https:','mailto:','tel:'].includes(parsed.protocol)) return u;
    return '#';
  }catch(e){ return u.startsWith('/') ? u : '#'; }
}

/* ---- RESOURCE FILE HELPERS: safe PDF viewing + reliable download links ---- */
function extractDriveFileId(url){
  try{
    const u = new URL(url, window.location.origin);
    if(!/drive\.google\.com$/i.test(u.hostname)) return null;
    const m = u.pathname.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
    if(m) return m[1];
    const id = u.searchParams.get('id');
    return id || null;
  }catch(_){ return null; }
}
function resourceViewURL(url){
  const safe = safeURL(url);
  if(safe==='#') return '#';
  const id = extractDriveFileId(safe);
  if(id) return `https://drive.google.com/file/d/${encodeURIComponent(id)}/preview`;
  return safe;
}
function resourceDownloadURL(url){
  const safe = safeURL(url);
  if(safe==='#') return '#';
  const id = extractDriveFileId(safe);
  if(id) return `https://drive.google.com/uc?export=download&id=${encodeURIComponent(id)}`;
  return safe;
}
function isLikelyPDF(url){
  try{
    const u = new URL(url, window.location.origin);
    return /\.pdf(?:$|[?#])/i.test(u.pathname) || /drive\.google\.com$/i.test(u.hostname);
  }catch(_){ return false; }
}
function openResourceFilePreview(fileURL, title, resourceId=null){
  const safe = safeURL(fileURL);
  if(safe==='#'){ toast('File link is not available.', 'error'); return; }

  const viewURL = resourceViewURL(safe);
  const downloadURL = resourceDownloadURL(safe);
  const canDownload = downloadURL && downloadURL !== '#';
  const pdf = isLikelyPDF(safe);

  openModal({
    title: `${pdf ? 'PDF' : 'File'} Preview`,
    wide: true,
    bodyHTML: `
      <div class="file-preview-shell">
        <div class="file-preview-top">
          <div class="preview-note">
            <strong style="color:var(--text-1)">${escapeHTML(title||'Resource')}</strong>
            <span style="display:block;margin-top:3px">Preview the file here first. You can open it separately or download it when ready.</span>
          </div>
          <a class="btn btn-ghost btn-sm" href="${safeURL(viewURL)}" target="_blank" rel="noopener noreferrer">
            ${ICONS.externalLink} Open separately
          </a>
        </div>
        <iframe
          class="file-preview-frame"
          src="${safeURL(viewURL)}"
          title="${escapeHTML(title||'File')} preview"
          loading="eager"
          allow="autoplay; fullscreen"
          referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
        <div class="file-preview-fallback">
          If the embedded preview does not load on your device, use <strong>Open separately</strong> above.
        </div>
      </div>`,
    actions: [
      {label:'Close', cls:'btn-ghost', onClick: closeModal},
      ...(canDownload ? [{
        label:'Download File',
        cls:'btn-primary',
        onClick: async () => {
          try{
            if(resourceId) await Service.recordDownload(resourceId);
            const w = window.open(downloadURL, '_blank', 'noopener,noreferrer');
            if(!w) window.location.href = downloadURL;
            toast('Download started.', 'success');
          }catch(err){
            toast(friendlyError(err,'Download failed.'), 'error');
          }
        }
      }] : [])
    ]
  });
}
function debounce(fn, wait){
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), wait); };
}
function slugify(str){
  return String(str||'').toLowerCase().trim()
    .replace(/[^a-z0-9\s-]/g,'')
    .replace(/\s+/g,'-')
    .replace(/-+/g,'-')
    .replace(/^-|-$/g,'');
}
function formatDate(d){
  if(!d) return '';
  try{ return new Date(d).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }catch(e){ return ''; }
}
function timeAgo(d){
  if(!d) return '';
  const diff = (Date.now() - new Date(d).getTime())/1000;
  if(diff < 60) return 'just now';
  if(diff < 3600) return Math.floor(diff/60)+'m ago';
  if(diff < 86400) return Math.floor(diff/3600)+'h ago';
  if(diff < 604800) return Math.floor(diff/86400)+'d ago';
  return formatDate(d);
}
function formatFileSize(bytes){
  if(!bytes) return '';
  const units=['B','KB','MB','GB']; let i=0; let n=bytes;
  while(n>=1024 && i<units.length-1){ n/=1024; i++; }
  return `${n.toFixed(n<10&&i>0?1:0)} ${units[i]}`;
}
function formatNum(n){
  if(n===null||n===undefined) return '0';
  if(n>=1000000) return (n/1000000).toFixed(1).replace(/\.0$/,'')+'M';
  if(n>=1000) return (n/1000).toFixed(1).replace(/\.0$/,'')+'K';
  return String(n);
}

/* ---- Toasts ---- */
function toast(message, type='info', duration=4200){
  const region = qs('#toast-region');
  const t = el('div',{class:`toast ${type}`, role:'status'});
  const icons = {success:'checkCircle',error:'alertCircle',warning:'alertCircle',info:'info'};
  t.innerHTML = `<span class="toast-icon">${ICONS[icons[type]||'info']}</span><span>${escapeHTML(message)}</span><button class="toast-close" aria-label="Dismiss">${ICONS.close}</button>`;
  region.appendChild(t);
  const remove = () => { t.classList.add('leaving'); setTimeout(()=>t.remove(), 200); };
  qs('.toast-close', t).addEventListener('click', remove);
  const timer = setTimeout(remove, duration);
  t.addEventListener('mouseenter', ()=>clearTimeout(timer));
}
function friendlyError(err, fallback){
  console.error('[Education Point] Supabase/Auth error:', err);

  const msg = String(err?.message || err?.error_description || err || '').trim();
  const code = String(err?.code || err?.status || '').trim();

  if(/already registered|user already exists/i.test(msg)){
    return 'This email is already registered. Please use Log In instead.';
  }
  if(/email.*not.*confirmed|confirm.*email/i.test(msg)){
    return 'Your email is not verified yet. Check your inbox and verify the email first.';
  }
  if(/signups.*disabled|signup.*disabled|email provider.*disabled/i.test(msg)){
    return 'Email sign-up is disabled in Supabase Authentication settings.';
  }
  if(/rate limit|too many requests/i.test(msg)){
    return 'Too many attempts. Please wait a few minutes and try again.';
  }
  if(/invalid.*api|invalid.*key|apikey|jwt/i.test(msg)){
    return 'The Supabase publishable key is invalid or does not belong to this project.';
  }
  if(/network|fetch|failed to fetch|load failed/i.test(msg)){
    return 'Network connection to Supabase failed. If you opened this HTML directly from your phone, deploy it to HTTPS (Netlify/Vercel) and try again.';
  }
  if(/permission|policy|RLS|row-level/i.test(msg)){
    return 'Supabase RLS denied this database operation.';
  }

  // Never hide an unknown Supabase error behind a generic message.
  return `Supabase error${code ? ` (${code})` : ''}: ${msg || (fallback || 'Unknown error')}`;
}

/* ---- Modal ---- */
function openModal({title, bodyHTML, wide=false, actions=[], onMount}){
  closeModal();
  const root = qs('#modal-root');
  const backdrop = el('div',{class:'modal-backdrop'});
  const box = el('div',{class:'modal-box'+(wide?' wide':'')});
  box.innerHTML = `
    <div class="modal-header">
      <h3>${escapeHTML(title||'')}</h3>
      <button class="modal-close" aria-label="Close">${ICONS.close}</button>
    </div>
    <div class="modal-body">${bodyHTML||''}</div>
    <div class="modal-actions"></div>
  `;
  const actionsWrap = qs('.modal-actions', box);
  actions.forEach(a => {
    const btn = el('button',{class:'btn '+(a.cls||'btn-ghost')+' btn-sm', onclick: a.onClick}, [a.label]);
    actionsWrap.appendChild(btn);
  });
  if(!actions.length) actionsWrap.remove();
  backdrop.appendChild(box);
  root.appendChild(backdrop);
  qs('.modal-close', box).addEventListener('click', closeModal);
  backdrop.addEventListener('click', e => { if(e.target===backdrop) closeModal(); });
  document.addEventListener('keydown', escCloseModal);
  if(onMount) onMount(box);
  const focusable = box.querySelector('input,select,textarea,button');
  if(focusable) setTimeout(()=>focusable.focus(), 60);
  return box;
}
function escCloseModal(e){ if(e.key==='Escape') closeModal(); }
function closeModal(){
  const root = qs('#modal-root');
  root.innerHTML = '';
  document.removeEventListener('keydown', escCloseModal);
}
function confirmModal(message, onConfirm, title='Are you sure?'){
  openModal({
    title,
    bodyHTML: `<p class="text-muted" style="font-size:14.5px;line-height:1.6">${escapeHTML(message)}</p>`,
    actions: [
      {label:'Cancel', cls:'btn-ghost', onClick: closeModal},
      {label:'Delete', cls:'btn-danger', onClick: async () => { await onConfirm(); closeModal(); }}
    ]
  });
}

/* ----------------------------------------------------------------
   4. ROUTER — History API based SPA routing with proper back/forward support
   ---------------------------------------------------------------- */
const Router = {
  routes: [],
  current: null,
  add(pattern, handler){ this.routes.push({pattern, handler, regex: this._toRegex(pattern)}); return this; },
  _toRegex(pattern){
    const paramNames = [];
    const regexStr = pattern.replace(/:[a-zA-Z]+/g, (m) => { paramNames.push(m.slice(1)); return '([^/]+)'; });
    return { regex: new RegExp('^'+regexStr+'$'), paramNames };
  },
  match(path){
    for(const r of this.routes){
      const m = path.match(r.regex.regex);
      if(m){
        const params = {};
        r.regex.paramNames.forEach((name,i) => params[name] = decodeURIComponent(m[i+1]));
        return { handler: r.handler, params };
      }
    }
    return null;
  },
  isLocalContext(){
    return location.protocol === 'file:' || location.protocol === 'content:';
  },
  currentPath(){
    const h = String(location.hash || '').replace(/^#/, '');
    if(h && h.startsWith('/')) return h;
    return window.location.pathname || '/';
  },
  navigate(path, replace=false){
    path = path || '/';

    // Android Chrome/content:// and local HTML files cannot reliably
    // serve clean History API routes such as /admin. Use the hash as
    // the transport layer while keeping the same internal SPA routes.
    if(this.isLocalContext()){
      const hash = path === '/' ? '' : '#' + path;
      try{
        if(replace) location.replace(location.pathname + location.search + hash);
        else location.hash = hash.slice(1);
      }catch(e){}
      this.current = path;
      this.resolve(path);
      window.scrollTo({top:0, behavior:'auto'});
      return;
    }

    try{
      if(replace) history.replaceState({path}, '', path);
      else history.pushState({path}, '', path);
    }catch(e){
      // Fallback for restricted webviews.
      try{ location.hash = path === '/' ? '' : path; }catch(_){}
    }
    this.resolve(path);
    window.scrollTo({top:0, behavior:'auto'});
  },
  resolve(path){
    path = path || this.currentPath();
    if(this.isLocalContext() && path === '/'){
      const h = String(location.hash || '').replace(/^#/, '');
      if(h) path = h;
    }
    if(!path.startsWith('/')) path = '/' + path;

    const match = this.match(path);
    closeAllPanels();
    if(match){
      this.current = path;
      Promise.resolve(match.handler(match.params, new URLSearchParams(window.location.search))).catch(err=>{
        console.error('[Education Point] Route error:', err);
        render404();
      });
    } else {
      render404();
    }
    updateActiveNavLinks(path);
  },
  init(){
    window.addEventListener('popstate', () => { this.resolve(this.currentPath()); });
    window.addEventListener('hashchange', () => {
      if(this.isLocalContext()) this.resolve(this.currentPath());
    });
    document.body.addEventListener('click', (e) => {
      const a = e.target.closest('a[data-link]');
      if(a){
        const href = a.getAttribute('href') || '/';
        // Only intercept internal SPA routes.
        if(href.startsWith('/')){
          e.preventDefault();
          e.stopPropagation();
          this.navigate(href);
        }
      }
    });
    this.resolve(this.currentPath());
  }
};
function go(path){ Router.navigate(path); }
function closeAllPanels(){
  qsa('.notif-panel.open').forEach(p=>p.classList.remove('open'));
  qsa('.nav-more-panel.open').forEach(p=>p.classList.remove('open'));
  const mm = qs('.mobile-menu'); if(mm) mm.classList.remove('open');
}
function updateActiveNavLinks(path){
  qsa('[data-nav-link]').forEach(a => {
    const target = a.getAttribute('href');

/* ----------------------------------------------------------------
   5. AUTH & SESSION STATE
   ---------------------------------------------------------------- */
const AppState = {
  session: null,
  user: null,        // supabase auth user
  profile: null,      // row from profiles table (includes role)
  isAdmin: false,
  categories: [],
  siteSettings: {},
  unreadNotifCount: 0,
  realtimeChannels: {},
  realtimeStatus: 'disconnected'
};

async function initAuth(){
  if(!SUPABASE_READY) return;

  const { data: { session } } = await supabase.auth.getSession();

  AppState.session = session;
  AppState.user = session ? session.user : null;

  // Establish admin state immediately from the verified Auth email.
  // The email is never a substitute for database RLS; it only controls
  // whether the admin UI is shown to the designated owner account.
  AppState.isAdmin = isSuperAdminEmail(AppState.user?.email);

  if(AppState.user){
    await loadProfile();
  }

  // Re-render AFTER auth/profile state is known.
  renderHeader();

  supabase.auth.onAuthStateChange(async (event, session) => {
    AppState.session = session;
    AppState.user = session ? session.user : null;

    AppState.profile = null;
    AppState.isAdmin = isSuperAdminEmail(AppState.user?.email);

    if(AppState.user){
      await loadProfile();
    }

    renderHeader();

    if(event==='SIGNED_IN' || event==='TOKEN_REFRESHED'){
      // Ensure the admin link is immediately visible after authentication.
      renderHeader();
    }

    if(event==='SIGNED_OUT'){
      AppState.isAdmin = false;
      teardownRealtime();
      go('/');
    }
  });
}

async function loadProfile(){
  // Preserve owner admin access even if a profile SELECT is blocked by RLS.
  AppState.isAdmin = isSuperAdminEmail(AppState.user?.email);

  try{
    const { data, error } = await supabase
      .from('profiles')
      .select('*')
      .eq('id', AppState.user.id)
      .single();

    if(error) throw error;

    AppState.profile = data;

    AppState.isAdmin =
      isSuperAdminEmail(AppState.user?.email) ||
      String(data?.role || '').toLowerCase() === 'admin';

  }catch(e){
    console.warn('[Education Point] Could not load profile:', e);

    // Do NOT downgrade the owner account to student because of an RLS
    // profile-read failure.
    AppState.profile = null;
    AppState.isAdmin = isSuperAdminEmail(AppState.user?.email);
  }
}
function requireAuth(redirectPath){
  if(!AppState.user){
    toast('Please log in to continue.', 'warning');
    openAuthModal('login');
    return false;
  }
  return true;
}

  async searchResources({ query='', categorySlug=null, categoryId=null, classId=null, subjectId=null, board=null, year=null, resourceType=null, examType=null, sort='latest', page=1, pageSize=12, featuredOnly=false } = {}){
    if(!SUPABASE_READY) return { rows:[], count:0 };
    let q = supabase.from('resources').select('*, categories(name,slug), classes(name), subjects(name)', {count:'exact'}).eq('status','published');
    if(query) q = q.or(`title.ilike.%${query}%,description.ilike.%${query}%`);

    // IMPORTANT: content sections are separated by the resources.category_id
    // column. Never filter a section only by class/subject, because the same
    // Mathematics subject can exist in Notes, Guess Papers and Past Papers.
    let resolvedCategoryId = categoryId || null;
    if(!resolvedCategoryId && categorySlug){
      const cached = (AppState.categories || []).find(c => c.slug === categorySlug);
      if(cached) resolvedCategoryId = cached.id;
      else {
        const { data: categoryRow, error: categoryError } = await supabase
          .from('categories')

          .eq('slug', categorySlug)
          .maybeSingle();
        if(categoryError || !categoryRow) return { rows:[], count:0 };
        resolvedCategoryId = categoryRow.id;
      }
    }
    if(categorySlug && !resolvedCategoryId) return { rows:[], count:0 };
    if(resolvedCategoryId) q = q.eq('category_id', resolvedCategoryId);
    if(classId) q = q.eq('class_id', classId);
    if(subjectId) q = q.eq('subject_id', subjectId);
    if(board) q = q.eq('board', board);
    if(year) q = q.eq('year', year);
    if(resourceType) q = q.eq('resource_type_id', resourceType);
    if(examType) q = q.eq('exam_type', examType);

    else if(sort==='views') q = q.order('view_count',{ascending:false});
    else if(sort==='az') q = q.order('title',{ascending:true});
    const from = (page-1)*pageSize, to = from+pageSize-1;
    q = q.range(from, to);
    const { data, error, count } = await q;
    if(error){ console.warn(error); return { rows:[], count:0 }; }

  async searchExamResources(examSlug, {page=1,pageSize=12,query='',sort='latest'}={}){
    if(!SUPABASE_READY) return {rows:[],count:0};
    const terms={mdcat:['mdcat'],ecat:['ecat'],paf:['paf'],'army-pma':['pma','army'],'other-entry-tests':['entry test','nts','css','pms','university']};
    const termsFor=terms[examSlug] || [examSlug.replace(/-/g,' ')];

    // Entry-test sections also use their own category. This prevents a
    // resource from another section from appearing merely because its title
    // contains a matching word.
    const cachedCategory = (AppState.categories || []).find(c => c.slug === examSlug);
    let categoryId = cachedCategory?.id || null;

      const { data: categoryRow, error: categoryError } = await supabase
        .from('categories')

    }

    let q=supabase.from('resources').select('*, categories(name,slug), classes(name), subjects(name)',{count:'exact'}).eq('status','published');
    q=q.eq('category_id', categoryId);

    const pieces=[];
    termsFor.forEach(t=>{const safe=t.replace(/[%(),]/g,' ').trim(); if(safe) pieces.push(`title.ilike.%${safe}%,exam_type.ilike.%${safe}%,description.ilike.%${safe}%`);});
    if(pieces.length) q=q.or(pieces.join(','));
    if(query){const safe=query.replace(/[%(),]/g,' ').trim(); if(safe) q=q.or(`title.ilike.%${safe}%,description.ilike.%${safe}%`);}
    if(sort==='downloads') q=q.order('download_count',{ascending:false});
    else if(sort==='views') q=q.order('view_count',{ascending:false});
    else if(sort==='az') q=q.order('title',{ascending:true});
    else q=q.order('created_at',{ascending:false});
    const from=(page-1)*pageSize,to=from+pageSize-1;
    const {data,error,count}=await q.range(from,to);

  async adminDeleteQuestion(id){ const {error}=await supabase.from('questions').delete().eq('id',id); if(error) throw error; },

/* ----------------------------------------------------------------
   7. REALTIME SUBSCRIPTIONS
   ---------------------------------------------------------------- */
function setupRealtime(){
  if(!SUPABASE_READY) return;
  teardownRealtime();
  try{
    const live = supabase.channel('education-point-live-v2', { config: { broadcast: { self: false }, presence: { key: AppState.user?.id || 'guest' } } });
    const watch = (table, event, callback, filter) => {
      const cfg = { event, schema:'public', table };
      if(filter) cfg.filter = filter;
      live.on('postgres_changes', cfg, callback);
    };
    watch('resources','*', payload => {
      if(payload.eventType === 'INSERT' && payload.new?.status === 'published') toast(`New resource published: ${payload.new.title || 'New resource'}`, 'info');
      if(payload.eventType === 'UPDATE' || payload.eventType === 'DELETE' || payload.eventType === 'INSERT') { safeRealtimeRefresh('resources'); safeRealtimeRefresh('admin-resources'); }
    });
    watch('announcements','*', payload => {
      if(payload.eventType === 'INSERT' && payload.new?.is_active !== false) toast(`New announcement: ${payload.new.title || 'Announcement'}`, 'info');
      safeRealtimeRefresh('announcements');
    });
    watch('categories','*', () => refreshCategoriesCache());
    watch('classes','*', () => safeRealtimeRefresh('classes'));
    watch('subjects','*', () => safeRealtimeRefresh('subjects'));
    watch('resource_types','*', () => safeRealtimeRefresh('resource_types'));
    watch('tests','*', payload => {
      if(payload.eventType === 'INSERT' && payload.new?.status === 'published') toast(`New test available: ${payload.new.title || 'New test'}`, 'info');
      safeRealtimeRefresh('tests');
    });
    watch('courses','*', payload => {
      if(payload.eventType === 'INSERT' && payload.new?.status === 'published') toast(`New course available: ${payload.new.title || 'New course'}`, 'info');
      safeRealtimeRefresh('courses');
    });
    watch('notifications','*', payload => { handleRealtimeNotification(payload.new); safeRealtimeRefresh('admin-notifications'); });
    watch('notification_reads','*', payload => {
      if(AppState.user && payload.new?.user_id === AppState.user.id) refreshNotifCount();
    });
    watch('site_settings','*', async () => {
      AppState.siteSettings = await Service.getSiteSettings();
      applyLiveSiteSettings();
    });
    watch('profiles','UPDATE', payload => {
      if(AppState.user && payload.new?.id === AppState.user.id) refreshCurrentProfile(payload.new);
    });
    watch('saved_resources','*', payload => {
      if(AppState.user && (payload.new?.user_id === AppState.user.id || payload.old?.user_id === AppState.user.id)) safeRealtimeRefresh('saved_resources');
    });
    watch('test_attempts','*', payload => {
      if(AppState.user && (payload.new?.user_id === AppState.user.id || payload.old?.user_id === AppState.user.id)) safeRealtimeRefresh('test_attempts');
    });
    live.on('presence', { event:'sync' }, () => updateRealtimePresence(live));
    live.on('presence', { event:'join' }, ({ key, newPresences }) => updateRealtimePresence(live, key, newPresences));
    live.on('presence', { event:'leave' }, ({ key, leftPresences }) => updateRealtimePresence(live, key, leftPresences));
    live.subscribe(async status => {
      AppState.realtimeStatus = status === 'SUBSCRIBED' ? 'connected' : (status === 'CLOSED' || status === 'CHANNEL_ERROR' ? 'disconnected' : 'connecting');
      updateRealtimeIndicator();
      if(status === 'SUBSCRIBED'){
        try { await live.track({ user_id:AppState.user?.id || null, role:AppState.isAdmin?'admin':'student', online_at:new Date().toISOString() }); } catch(e) {}
        window.dispatchEvent(new CustomEvent('educationpoint:realtime-connected'));
      }
    });
    AppState.realtimeChannels.main = live;
  }catch(e){
    AppState.realtimeStatus='disconnected';
    updateRealtimeIndicator();
    console.warn('Realtime setup failed', e);
  }
}
function safeRealtimeRefresh(kind){
  clearTimeout(window.__epRealtimeRefresh);
  window.__epRealtimeRefresh = setTimeout(async () => {
    try{
      if(kind === 'resources' && Router.current === '/') { await loadHomeStats(); renderHomeBento(); }
      else if(kind === 'announcements' && Router.current === '/announcements') renderAnnouncementsPage();
      else if(kind === 'tests' && Router.current === '/tests') renderTestList();
      else if(kind === 'courses' && Router.current === '/courses') renderCourses();
      else if(kind === 'saved_resources' && Router.current === '/dashboard') renderDashboard({},'saved');
      else if(kind === 'test_attempts' && Router.current === '/dashboard') renderDashboard({},'tests');
      else if(kind === 'admin-resources' && qs('#admin-main') && Router.current?.startsWith('/admin')) loadAdminResourcesTable();
      else if(kind === 'admin-notifications' && qs('#admin-main') && Router.current?.startsWith('/admin')) adminRenderNotifications(qs('#admin-main'));
    }catch(e){ console.warn('Live refresh failed:', e); }
  }, 180);
}
function handleRealtimeNotification(n){
  if(!n || n.is_active === false || !AppState.user) return;
  const target=String(n.target_role||'').toLowerCase();
  const allowed=target===(AppState.isAdmin?'admin':'student');
  if(!allowed) return;
  AppState.unreadNotifCount = Math.max(0, Number(AppState.unreadNotifCount||0)) + 1;
  updateNotifBadge();
  toast(n.title || 'New notification', 'info');
  const panel = qs('#notif-panel-el');
  if(panel) setTimeout(() => toggleNotifPanel(), 250);
}
async function refreshCurrentProfile(profile){
  if(!profile || !AppState.user) return;
  AppState.profile = { ...(AppState.profile||{}), ...profile };
  const name = profile.full_name || profile.name || AppState.user.email?.split('@')[0] || 'Student';
  qsa('[data-current-user-name]').forEach(x => x.textContent = name);
}
function applyLiveSiteSettings(){
  const s = AppState.siteSettings || {};
  if(s.site_name) document.title = s.site_name;
  qsa('[data-site-name]').forEach(x => x.textContent = s.site_name || 'Education Point');
  if(s.maintenance_mode === 'true' && !AppState.isAdmin) renderMaintenance();
}
function updateRealtimePresence(channel, key, presences){
  try{
    const state = channel.presenceState();
    const count = Object.keys(state||{}).length;
    qsa('[data-live-users]').forEach(x => x.textContent = count);
    window.dispatchEvent(new CustomEvent('educationpoint:presence', { detail:{ count, key, presences } }));
  }catch(e){}
}
function startRealtimeWatchdog(){
  if(window.__epRealtimeWatchdog) clearInterval(window.__epRealtimeWatchdog);
  window.__epRealtimeWatchdog = setInterval(() => {
    if(!SUPABASE_READY) return;
    const ch = AppState.realtimeChannels.main;
    if(!ch || AppState.realtimeStatus === 'disconnected') setupRealtime();
  }, 30000);
}
function stopRealtimeWatchdog(){
  if(window.__epRealtimeWatchdog) clearInterval(window.__epRealtimeWatchdog);
  window.__epRealtimeWatchdog = null;
}
function teardownRealtime(){
  stopRealtimeWatchdog();
  if(!SUPABASE_READY) return;
  Object.values(AppState.realtimeChannels||{}).forEach(ch => { try{ supabase.removeChannel(ch); }catch(e){} });
  AppState.realtimeChannels = {};
  AppState.realtimeStatus = 'disconnected';
  updateRealtimeIndicator();
}
function updateRealtimeIndicator(){
  const dot = qs('#rt-indicator');
  if(!dot) return;
  const connected = AppState.realtimeStatus === 'connected';
  dot.title = connected ? 'Live updates connected' : (AppState.realtimeStatus === 'connecting' ? 'Connecting to live updates…' : 'Live updates disconnected');
  dot.classList.toggle('rt-on', connected);
  dot.classList.toggle('rt-pending', AppState.realtimeStatus === 'connecting');
  const label = qs('#rt-label');
  if(label) label.textContent = connected ? 'LIVE' : (AppState.realtimeStatus === 'connecting' ? 'SYNC' : 'OFFLINE');
}
function startRealtimeFeatures(){
  if(!SUPABASE_READY) return;
  setupRealtime();
  startRealtimeWatchdog();
}
function enableRealtimeUi(){
  if(qs('#realtime-live-style')) return;
  const style=document.createElement('style'); style.id='realtime-live-style'; style.textContent=`
    #rt-indicator{position:relative;display:inline-block;width:8px;height:8px;border-radius:50%;background:#9a9a9a;box-shadow:0 0 0 4px rgba(0,0,0,.05);transition:.25s}
    #rt-indicator.rt-on{background:#111;box-shadow:0 0 0 4px rgba(17,17,17,.08),0 0 14px rgba(17,17,17,.28)}
    #rt-indicator.rt-pending{animation:epPulse 1.1s ease-in-out infinite}
    #rt-label{font-size:9px;letter-spacing:.12em;font-weight:800;color:#777}
    .ep-live-bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9998;display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.72);backdrop-filter:blur(20px);border-radius:999px;box-shadow:0 12px 40px rgba(0,0,0,.12);opacity:.88;font-size:10px;color:#555}
    .ep-live-bar strong{font-size:10px;color:#111}
    @keyframes epPulse{0%,100%{opacity:.45;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
    @media(max-width:600px){.ep-live-bar{bottom:10px;font-size:9px}}
  `; document.head.appendChild(style);
  if(!qs('#ep-live-bar')){ const bar=document.createElement('div'); bar.id='ep-live-bar'; bar.className='ep-live-bar'; bar.innerHTML='<span id="rt-indicator"></span><strong id="rt-label">SYNC</strong><span>Realtime</span>'; document.body.appendChild(bar); }
  updateRealtimeIndicator();
}
function registerRealtimeLifecycle(){
  window.addEventListener('online', () => { if(SUPABASE_READY) setupRealtime(); });
  document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible' && SUPABASE_READY && AppState.realtimeStatus!=='connected') setupRealtime(); });
  window.addEventListener('beforeunload', () => teardownRealtime());
}

/* ----------------------------------------------------------------
   AUTH MODAL — sign up / login / forgot password
   ---------------------------------------------------------------- */
function openAuthModal(mode='login'){
  const box = openModal({
    title: mode==='login' ? 'Log in to your account' : (mode==='signup' ? 'Create your account' : 'Reset your password'),
    bodyHTML: `
      <form id="auth-form">
        ${mode==='signup' ? `<div class="field"><label for="af-name">Full name</label><input id="af-name" required autocomplete="name"></div>` : ''}
        <div class="field"><label for="af-email">Email</label><input id="af-email" type="email" required autocomplete="email"></div>
        ${mode!=='forgot' ? `<div class="field"><label for="af-pass">Password</label><input id="af-pass" type="password" required minlength="6" autocomplete="${mode==='signup'?'new-password':'current-password'}"></div>` : ''}
        <button class="btn btn-primary btn-block" type="submit" id="auth-submit">${mode==='login'?'Log In':mode==='signup'?'Sign Up':'Send Reset Link'}</button>
      </form>
      <div style="margin-top:16px;text-align:center;font-size:13.5px;color:var(--text-2)">
        ${mode==='login' ? `<a href="#" id="to-forgot">Forgot password?</a> &middot; <a href="#" id="to-signup">Create an account</a>`
          : mode==='signup' ? `Already have an account? <a href="#" id="to-login">Log in</a>`
          : `<a href="#" id="to-login">Back to login</a>`}
      </div>
    `
  });
  qs('#auth-form', box).addEventListener('submit', async e => {
    e.preventDefault();
    if(!(await ensureSupabaseClient())){
      toast('Supabase connection failed: ' + (SUPABASE_INIT_ERROR || 'Unknown error'), 'warning', 9000);
      return;
    }
    const submitBtn = qs('#auth-submit', box);
    submitBtn.disabled = true; submitBtn.innerHTML = `<span class="spinner"></span>`;
    const email = qs('#af-email', box).value.trim();
    try{
      if(!navigator.onLine){
        throw new Error('Your device is offline.');
      }

      if(mode==='login'){
        const pass = qs('#af-pass', box).value;
        const result = await Promise.race([
          supabase.auth.signInWithPassword({ email, password: pass }),
          new Promise((_, reject)=>setTimeout(()=>reject(new Error('Supabase Auth request timed out.')), 15000))
        ]);
        if(result.error) throw result.error;

        toast(AppState.isAdmin ? 'Welcome back, Admin!' : 'Welcome back!', 'success');
        closeModal();
        // Admin users go directly to the administration workspace.
        go(AppState.isAdmin ? '/admin' : '/dashboard');

      } else if(mode==='signup'){
        const name = qs('#af-name', box).value.trim();
        const pass = qs('#af-pass', box).value;

        const result = await Promise.race([
          supabase.auth.signUp({
            email,
            password: pass,
            options:{
              data:{ full_name:name }
            }
          }),
          new Promise((_, reject)=>setTimeout(()=>reject(new Error('Supabase Auth request timed out.')), 15000))
        ]);

        if(result.error) throw result.error;

        const createdUser = result.data?.user;

        // Profile creation is intentionally best-effort. RLS should not make
        // an otherwise successful Supabase Auth signup look like an Auth error.
        if(createdUser){
          try{
            const profileResult = await supabase.from('profiles').upsert({
              id: createdUser.id,
              full_name: name,
              role: isSuperAdminEmail(email) ? 'admin' : 'student'
            });
            if(profileResult.error){
              console.warn('[Education Point] Profile upsert skipped:', profileResult.error);
            }
          }catch(profileError){
            console.warn('[Education Point] Profile upsert skipped:', profileError);
          }
        }

        if(result.data?.session){
          toast(
            isSuperAdminEmail(email)
              ? 'Super Admin account created successfully!'
              : 'Account created successfully!',
            'success'
          );
        }else{
          toast(
            isSuperAdminEmail(email)
              ? 'Super Admin account created. Please verify your email, then log in.'
              : 'Account created. Please verify your email, then log in.',
            'success',
            7000
          );
        }
        closeModal();

      } else {
        const result = await Promise.race([
          supabase.auth.resetPasswordForEmail(email),
          new Promise((_, reject)=>setTimeout(()=>reject(new Error('Supabase Auth request timed out.')), 15000))
        ]);
        if(result.error) throw result.error;

        toast('Password reset email sent.', 'success');
        closeModal();
      }

    }catch(err){
      const message = friendlyError(err, 'Authentication failed.');
      toast(message, 'error', 10000);

      // Keep the exact error in the console for debugging.
      console.error('[Education Point] AUTH FAILURE', {
        message: err?.message,
        code: err?.code,
        status: err?.status,
        name: err?.name,
        details: err?.details,
        hint: err?.hint
      });

      submitBtn.disabled = false;
      submitBtn.innerHTML =
        mode==='login' ? 'Log In' :
        mode==='signup' ? 'Sign Up' :
        'Send Reset Link';
    }
  });
  const rebind = (id, newMode) => { const a = qs(id, box); if(a) a.addEventListener('click', e=>{ e.preventDefault(); openAuthModal(newMode); }); };
  rebind('#to-forgot','forgot'); rebind('#to-signup','signup'); rebind('#to-login','login');
}
async function logout(){
  if(SUPABASE_READY) await supabase.auth.signOut();
  toast('Logged out successfully.', 'success');
}

        toast(wasSaved ? 'Removed from saved' : 'Saved to your dashboard', 'success');

  const meta = SECTION_META[section] || {title: section};
  const main = qs('#main');
  pageLoading(main);
  // Resolve the category first, then resolve class and subject ONLY inside that
  // category. This prevents a global 9th/Math subject from leaking into
  // Guess Papers, Notes, Pairing Schemes, etc. when no resource exists there.
  const category = (AppState.categories || []).find(c => c.slug === section) ||
    await Service.getCategoryBySlug(section);
  if(!category){ render404(); return; }
  const classes = await Service.getClassesForCategory(category.id);
  const cls = classes.find(c => c.slug===classSlugOrId || String(c.id)===classSlugOrId);
  if(!cls){ render404(); return; }
  const subjects = await Service.getSubjectsForCategoryClass(category.id, cls.id);
  const subj = subjects.find(s => s.slug===subjectSlugOrId || String(s.id)===subjectSlugOrId);
  if(!subj){ render404(); return; }
  setMeta(`${cls.name} ${subj.name} ${meta.title}`, `${cls.name} ${subj.name} ${meta.title} — Education Point`);
  browseState = { section, categorySlug:section, categoryId:category.id, classId:cls.id, subjectId:subj.id, page:1, sort:'latest' };
  main.innerHTML = `
    <div class="container section">
      ${breadcrumbHTML([{label:'Home',href:'/'},{label:meta.title,href:'/'+section},{label:cls.name,href:`/${section}/${cls.slug||cls.id}`},{label:subj.name}])}
      <div class="page-header"><h1>${escapeHTML(cls.name)} ${escapeHTML(subj.name)} — ${escapeHTML(meta.title)}</h1></div>
      <div class="filter-bar">
        <div class="search-mini">${ICONS.search}<input id="rl-search" placeholder="Search within results…"></div>
        <select id="rl-sort"><option value="latest">Latest</option><option value="downloads">Most Downloaded</option><option value="views">Most Viewed</option><option value="az">A–Z</option></select>
      </div>
      <div class="grid grid-4" id="resource-list-grid"></div>
      <div class="pagination" id="resource-list-pagination"></div>
    </div>
  `;
  qs('#rl-search').addEventListener('input', debounce(loadResourceList, 350));
  qs('#rl-sort').addEventListener('change', e => { browseState.sort = e.target.value; browseState.page=1; loadResourceList(); });
  loadResourceList();
}
async function loadResourceList(){
  const grid = qs('#resource-list-grid');
  if(!grid) return;
  grid.innerHTML = Array(8).fill('<div class="skeleton skel-card"></div>').join('');
  const query = qs('#rl-search') ? qs('#rl-search').value.trim() : '';
  const { rows, count } = await Service.searchResources({ categoryId:browseState.categoryId, categorySlug:browseState.categorySlug, classId: browseState.classId, subjectId: browseState.subjectId, query, sort: browseState.sort, page: browseState.page, pageSize:12 });
  if(!rows.length){
    grid.outerHTML = emptyStateHTML('folder','Coming Soon','No published resources match yet. Check back soon.');
    qs('#resource-list-pagination').innerHTML = '';
    return;
  }
  grid.innerHTML = rows.map(resourceCardHTML).join('');
  bindResourceCardEvents(grid);
  renderPagination('#resource-list-pagination', browseState.page, Math.ceil(count/12), p => { browseState.page=p; loadResourceList(); window.scrollTo({top:0,behavior:'smooth'}); });
}
function renderPagination(sel, page, totalPages, onPage){
  const wrap = qs(sel);
  if(!wrap || totalPages<=1) { if(wrap) wrap.innerHTML=''; return; }
  let html = `<button class="page-btn" ${page<=1?'disabled':''} data-p="${page-1}">${ICONS.chevronLeft}</button>`;
  const maxShown = 5;
  let start = Math.max(1, page-2), end = Math.min(totalPages, start+maxShown-1);
  start = Math.max(1, end-maxShown+1);
  for(let i=start;i<=end;i++) html += `<button class="page-btn ${i===page?'active':''}" data-p="${i}">${i}</button>`;
  html += `<button class="page-btn" ${page>=totalPages?'disabled':''} data-p="${page+1}">${ICONS.chevronRight}</button>`;
  wrap.innerHTML = html;
  qsa('.page-btn', wrap).forEach(b => b.addEventListener('click', () => { if(!b.disabled) onPage(parseInt(b.dataset.p)); }));
}
function breadcrumbHTML(items){
  return `<div class="breadcrumbs">${items.map((it,i)=>`${i>0?'<span class="sep">/</span>':''}${it.href?`<a href="${it.href}" data-link>${escapeHTML(it.label)}</a>`:`<span>${escapeHTML(it.label)}</span>`}`).join('')}</div>`;
}

let activeTest = { data:null, answers:{}, startedAt:null, timerInterval:null, remainingSeconds:0 };
async function renderTakeTest(testId){
  if(!requireAuth()){ go('/tests'); return; }
  const main = qs('#main');
  pageLoading(main);
  const test = await Service.getTestWithQuestions(testId);
  if(!test){ render404(); return; }
  setMeta(test.title, `Take the ${test.title} test.`);
  activeTest = { data: test, answers:{}, startedAt: new Date().toISOString(), remainingSeconds: (test.duration_minutes||30)*60 };
  main.innerHTML = `
    <div class="container section test-shell">
      <div class="test-timer"><span>${escapeHTML(test.title)}</span><span class="time" id="test-time">--:--</span></div>
      <div id="questions-wrap">${test.questions.map((q,i)=>questionCardHTML(q,i)).join('')}</div>
      <button class="btn btn-primary btn-block" id="submit-test-btn" style="margin-top:20px">Submit Test</button>
    </div>
  `;
  qsa('.option-row', main).forEach(opt => opt.addEventListener('click', () => {
    const qId = opt.dataset.qid, letter = opt.dataset.letter;
    const card = opt.closest('.question-card');
    qsa('.option-row', card).forEach(o=>o.classList.remove('selected'));
    opt.classList.add('selected');
    activeTest.answers[qId] = letter;
  }));
  qs('#submit-test-btn').addEventListener('click', submitActiveTest);
  clearInterval(activeTest.timerInterval);
  activeTest.timerInterval = setInterval(() => {
    activeTest.remainingSeconds--;
    const t = qs('#test-time');
    if(t){ const m=Math.floor(activeTest.remainingSeconds/60), s=activeTest.remainingSeconds%60; t.textContent = `${m}:${String(s).padStart(2,'0')}`; }
    if(activeTest.remainingSeconds<=0){ clearInterval(activeTest.timerInterval); submitActiveTest(); }
  }, 1000);
}
function questionCardHTML(q, i){
  return `<div class="question-card"><div class="question-num">Question ${i+1} of ${activeTest.data?activeTest.data.questions.length:''}</div><div class="question-text">${escapeHTML(q.question)}</div>
    ${['a','b','c','d'].map(l => q['option_'+l] ? `<div class="option-row" data-qid="${q.id}" data-letter="${l}"><span class="option-letter">${l.toUpperCase()}</span><span>${escapeHTML(q['option_'+l])}</span></div>` : '').join('')}
  </div>`;
}
async function submitActiveTest(){
  clearInterval(activeTest.timerInterval);
  const btn = qs('#submit-test-btn');
  if(btn){ btn.disabled = true; btn.innerHTML = `<span class="spinner"></span>`; }
  try{
    const result = await Service.submitTestAttempt(activeTest.data.id, activeTest.answers, activeTest.startedAt);
    toast('Test submitted!', 'success');
    go('/test-result/'+(result?.attempt_id || result?.id || ''));
  }catch(err){ toast(friendlyError(err,'Could not submit test.'), 'error'); if(btn){btn.disabled=false; btn.textContent='Submit Test';} }
}

async function renderAdminPanel(params, searchParams, tab='dashboard'){

  const root = qs('#app-root');
  root.innerHTML = `
    <div class="admin-shell">
      <header class="admin-header">
        <div class="admin-brand-wrap"><a href="/" data-link class="brand" style="color:#fff"><span class="brand-mark">E</span><span class="brand-name">Education Point Admin</span></a><span class="admin-founder">Muhammad Rizwan · SUPER ADMIN</span></div>

      </header>
      <div class="admin-body">

      </div>
    </div>

  loadAdminTab(tab);

  qsa('[data-feature]',tbody).forEach(b=>b.addEventListener('click',async()=>{ const r=rows.find(x=>x.id===b.dataset.feature); try{ await Service.adminUpdateResource(r.id,{featured: !r.featured}); toast('Updated.','success'); loadAdminResourcesTable(); }catch(e){toast(friendlyError(e),'error');} }));
  qsa('[data-duplicate]',tbody).forEach(b=>b.addEventListener('click',()=>{ const r=rows.find(x=>x.id===b.dataset.duplicate); confirmModal(`Duplicate "${r.title}" including all chapters?`, async()=>{ try{ await Service.adminDuplicateResource(r.id); toast('Resource duplicated.','success'); loadAdminResourcesTable(); }catch(e){toast(friendlyError(e),'error');} }); }));
  qsa('[data-del]',tbody).forEach(b=>b.addEventListener('click',()=>{ const r=rows.find(x=>x.id===b.dataset.del); confirmModal(`Are you sure you want to delete "${r.title}"?`, async()=>{ try{ await Service.adminDeleteResource(r.id, r.file_path, r.thumbnail_path); toast('Resource deleted.','success'); loadAdminResourcesTable(); }catch(e){toast(friendlyError(e),'error');} }); }));
  renderPagination('#ar-pagination', adminResState.page, Math.ceil(count/15), p=>{adminResState.page=p; loadAdminResourcesTable();});
}
async function openResourceForm(existing){
  const [categories, classes, types] = await Promise.all([Service.getCategories({activeOnly:false}), Service.getClasses({activeOnly:false}), Service.getResourceTypes()]);
  const r = existing || {};
  const subjects = await Service.getSubjects({activeOnly:false});
  const existingChapters = existing ? await Service.adminListResourceChapters(existing.id).catch(()=>[]) : [];
  const isNotes = categories.find(c=>c.id===r.category_id)?.slug === 'notes';

  const chapterRow = (c={}, i=0) => `
    <div class="chapter-row card" style="padding:13px;margin-bottom:9px" data-chapter-row>
      <div class="grid grid-2">
        <div class="field"><label>Chapter #</label><input data-ch-number type="number" min="1" value="${c.chapter_number||i+1}"></div>
        <div class="field"><label>Chapter Title</label><input data-ch-title required value="${escapeHTML(c.title||'')}"></div>
        <div class="field"><label>Chapter Google Drive Link</label><input data-ch-url type="url" value="${escapeHTML(c.file_url||'')}" placeholder="https://drive.google.com/..."></div>
        <div class="field"><label>Description (optional)</label><input data-ch-desc value="${escapeHTML(c.description||'')}"></div>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" data-remove-chapter>${ICONS.trash} Remove</button>
    </div>`;

  const box = openModal({ title: existing?'Edit Resource':'Add Resource', wide:true, bodyHTML:`
    <form id="res-form">
      <div class="field"><label>Title</label><input id="rf-title" required value="${escapeHTML(r.title||'')}"></div>
      <div class="field"><label>Description</label><textarea id="rf-desc">${escapeHTML(r.description||'')}</textarea></div>
      <div class="grid grid-2">
        <div class="field"><label>Category</label>
          <select id="rf-cat" required>${categories.map(c=>`<option value="${c.id}" ${r.category_id===c.id?'selected':''}>${escapeHTML(c.name)}</option>`).join('')}</select>
          <span class="field-hint">This controls where the resource appears. Existing section behavior remains unchanged.</span>
        </div>
        <div class="field"><label>Resource Type</label><select id="rf-type">${types.map(t=>`<option value="${t.id}" ${r.resource_type_id===t.id?'selected':''}>${escapeHTML(t.name)}</option>`).join('')}<option value="">Other</option></select></div>
        <div class="field"><label>Class (optional)</label><select id="rf-class"><option value="">— None —</option>${classes.map(c=>`<option value="${c.id}" ${r.class_id===c.id?'selected':''}>${escapeHTML(c.name)}</option>`).join('')}</select></div>
        <div class="field"><label>Subject (optional)</label><select id="rf-subject"><option value="">— None —</option>${subjects.map(s=>`<option value="${s.id}" ${r.subject_id===s.id?'selected':''}>${escapeHTML(s.name)}</option>`).join('')}</select><span class="field-hint">Subjects are global and can be used with any class.</span></div>
        <div class="field"><label>Board</label><input id="rf-board" value="${escapeHTML(r.board||'')}"></div>
        <div class="field"><label>Year</label><input id="rf-year" type="number" value="${r.year||''}"></div>
        <div class="field"><label>Exam Type</label><input id="rf-exam" value="${escapeHTML(r.exam_type||'')}"></div>
      </div>
      <div class="field"><label>Google Drive / Download Link</label><input id="rf-url" type="text" placeholder="https://drive.google.com/..." value="${escapeHTML(r.external_url||r.file_url||'')}"><span class="field-hint">You can use one main link, or add multiple files below. If you paste a link without https://, it will be fixed automatically.</span></div>
      <div class="field"><label>Thumbnail URL (optional)</label><input id="rf-thumb-url" type="url" placeholder="https://..." value="${escapeHTML(r.thumbnail_url||'')}"></div>

      <div class="multiple-options-toggle">
        <div class="toggle-copy">
          <div class="toggle-title">Add multiple files / options</div>
          <span class="toggle-help">Turn this on only when this resource has more than one file or chapter. It stays off automatically for a new resource.</span>
        </div>
        <input type="checkbox" id="rf-multiple" ${existingChapters.length?'checked':''} aria-label="Add multiple files or options">
      </div>

      <div id="chapter-manager" style="display:${existingChapters.length?'block':'none'};margin:8px 0 18px">
        <div class="flex justify-between items-center" style="margin-bottom:10px;gap:12px">
          <div><h3 style="font-size:15px">${isNotes?'Chapter-wise Notes':`Multiple ${escapeHTML(categories.find(c=>c.id===r.category_id)?.name||'Resource')} Options`}</h3><span class="field-hint">Only the files you add here will appear under this resource. The selected category remains unchanged for every option.</span></div>
          <button type="button" class="btn btn-ghost btn-sm" id="add-chapter-btn">${ICONS.plus} Add Option</button>
        </div>
        <div id="chapter-list">${existingChapters.length ? existingChapters.map((c,i)=>chapterRow(c,i)).join('') : chapterRow({},0)}</div>
      </div>

      <div class="grid grid-2">
        <div class="field"><label>Status</label><select id="rf-status"><option value="draft" ${r.status==='draft'?'selected':''}>Draft</option><option value="published" ${r.status==='published'?'selected':''}>Published</option></select></div>
        <div class="field" style="justify-content:center"><div class="checkbox-row"><input type="checkbox" id="rf-featured" ${r.featured?'checked':''}><label for="rf-featured" style="margin:0">Featured</label></div></div>
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="rf-submit">${existing?'Save Changes':'Create Resource'}</button>
    </form>
  `});

  const updateMultipleOptionsUI = () => {
    const enabled = !!qs('#rf-multiple',box)?.checked;
    const selected = categories.find(c=>c.id===qs('#rf-cat',box).value);
    qs('#chapter-manager',box).style.display = enabled ? 'block' : 'none';
    qs('#rf-url',box).required = !enabled;
    const heading = qs('#chapter-manager h3',box);
    if(heading) heading.textContent = selected?.slug === 'notes'
      ? 'Chapter-wise Notes'
      : `Multiple ${selected?.name || 'Resource'} Options`;
  };
  qs('#rf-cat', box).addEventListener('change', updateMultipleOptionsUI);
  qs('#rf-multiple', box).addEventListener('change', updateMultipleOptionsUI);
  qs('#add-chapter-btn',box).addEventListener('click',()=>{
    const list=qs('#chapter-list',box);
    list.insertAdjacentHTML('beforeend',chapterRow({},list.querySelectorAll('[data-chapter-row]').length));
    bindChapterRemove(list.lastElementChild);
  });
  function bindChapterRemove(row){
    qs('[data-remove-chapter]',row).addEventListener('click',()=>row.remove());
  }
  qsa('[data-remove-chapter]',box).forEach(btn=>btn.addEventListener('click',()=>btn.closest('[data-chapter-row]').remove()));

  qs('#res-form',box).addEventListener('submit',async e=>{
    e.preventDefault();
    const submitBtn=qs('#rf-submit',box); submitBtn.disabled=true;
    const title=qs('#rf-title',box).value.trim();
    const url=qs('#rf-url',box).value.trim();
    const selectedCategory=categories.find(c=>c.id===qs('#rf-cat',box).value);
    const multipleEnabled = !!qs('#rf-multiple',box)?.checked;
    const rows=multipleEnabled ? [...qsa('[data-chapter-row]',box)].map((row,i)=>({
      chapter_number:parseInt(qs('[data-ch-number]',row).value,10)||i+1,
      title:qs('[data-ch-title]',row).value.trim(),
      file_url:qs('[data-ch-url]',row).value.trim(),
      description:qs('[data-ch-desc]',row).value.trim()
    })).filter(c=>c.title||c.file_url) : [];
    if(!selectedCategory){toast('Please select a resource category.','warning');submitBtn.disabled=false;return;}
    const normalizeLink = value => {
      const v=String(value||'').trim();
      if(!v) return '';
      return /^https?:\/\//i.test(v) ? v : ('https://'+v.replace(/^\/+/,''));
    };
    const normalizedUrl=normalizeLink(url);
    rows.forEach(c=>{ c.file_url=normalizeLink(c.file_url); });
    if(!multipleEnabled && !normalizedUrl){toast('Please enter a main resource link, or turn on “Add multiple files / options”.','warning');submitBtn.disabled=false;return;}
    if(normalizedUrl && !/^https?:\/\//i.test(normalizedUrl)){toast('Please enter a valid resource link.','warning');submitBtn.disabled=false;return;}
    if(multipleEnabled && !rows.length){toast('Add at least one file/option after enabling multiple files.','warning');submitBtn.disabled=false;return;}
    if(rows.length){
      const bad=rows.find(c=>!c.title || !c.file_url);
      if(bad){toast('Every additional file/option needs a title and a link.','warning');submitBtn.disabled=false;return;}
    }
    const payload={
      title,description:qs('#rf-desc',box).value.trim(),category_id:selectedCategory.id,
      resource_type_id:qs('#rf-type',box).value||null,class_id:qs('#rf-class',box).value||null,
      subject_id:qs('#rf-subject',box).value||null,board:qs('#rf-board',box).value.trim()||null,
      year:qs('#rf-year',box).value?parseInt(qs('#rf-year',box).value,10):null,
      exam_type:qs('#rf-exam',box).value.trim()||null,
      file_url:normalizedUrl||null,file_path:null,file_size:null,thumbnail_path:null,
      thumbnail_url:qs('#rf-thumb-url',box).value.trim()||null,status:qs('#rf-status',box).value,
      featured:qs('#rf-featured',box).checked,created_by:AppState.user?.id||null,
      slug:existing?.slug||(slugify(title)+'-'+Date.now().toString(36))
    };
    try{
      let saved;
      if(existing){
        saved=await Service.adminUpdateResource(existing.id,payload);
        await Service.adminReplaceResourceChapters(existing.id,rows);
      }else{
        saved=await Service.adminCreateResource(payload);
        if(rows.length) await Service.adminCreateResourceChapters(saved.id,rows);
      }
      toast(existing?'Resource updated.':'Resource created.','success');closeModal();loadAdminResourcesTable();
    }catch(err){toast(friendlyError(err,'Could not save resource.'),'error');submitBtn.disabled=false;}
  });
} 
/* ---- Categories / Classes / Subjects taxonomy manager (shared UI) ---- */
async function adminRenderTaxonomy(main, kind){
  const labels = {categories:['Categories','Category'], classes:['Classes','Class'], subjects:['Subjects','Subject']};
  const [plural, singular] = labels[kind];
  let rows = kind==='categories' ? await Service.getCategories({activeOnly:false}) : kind==='classes' ? await Service.getClasses({activeOnly:false}) : await Service.getSubjects({activeOnly:false});
  const classesForSubject = kind==='subjects' ? await Service.getClasses({activeOnly:false}) : [];
  main.innerHTML = `
    <div class="flex justify-between items-center" style="margin-bottom:18px">
      <h2 style="color:#fff;font-size:22px;font-family:var(--font-display)">${plural}</h2>
      <button class="btn btn-primary btn-sm" id="add-tax-btn">${ICONS.plus} Add ${singular}</button>
    </div>
    <div class="table-scroll admin-card" style="padding:0">
      <table class="data-table"><thead><tr><th>Name</th>${kind==='subjects'?'<th>Scope</th>':''}<th>Status</th><th>Actions</th></tr></thead><tbody id="tax-tbody"></tbody></table>
    </div>
  `;
  function renderRows(){
    const tbody = qs('#tax-tbody');
    if(!rows.length){ tbody.innerHTML = `<tr><td colspan="4">No ${plural.toLowerCase()} yet. Add one to get started.</td></tr>`; return; }
    tbody.innerHTML = rows.map(item => `<tr>
      <td style="color:#fff;font-weight:600">${escapeHTML(item.name)}</td>
      ${kind==='subjects'?`<td><span class="badge badge-gray">All Classes</span></td>`:''}
      <td><span class="badge ${item.is_active?'badge-teal':'badge-gray'}">${item.is_active?'Active':'Inactive'}</span></td>
      <td><div class="table-actions"><button data-edit="${item.id}">${ICONS.edit}</button><button data-toggle="${item.id}">${ICONS.checkCircle}</button><button data-del="${item.id}">${ICONS.trash}</button></div></td>
    </tr>`).join('');
    qsa('[data-edit]',tbody).forEach(b=>b.addEventListener('click',()=>openTaxForm(kind, singular, rows.find(x=>x.id===b.dataset.edit), classesForSubject, refresh)));
    qsa('[data-toggle]',tbody).forEach(b=>b.addEventListener('click',async()=>{ const item=rows.find(x=>x.id===b.dataset.toggle); await taxUpdate(kind,item.id,{is_active:!item.is_active}); refresh(); }));
    qsa('[data-del]',tbody).forEach(b=>b.addEventListener('click',()=>{ const item=rows.find(x=>x.id===b.dataset.del); confirmModal(`Delete "${item.name}"? This cannot be undone.`, async()=>{ await taxDelete(kind,item.id); refresh(); }); }));
  }
  async function refresh(){
    rows = kind==='categories' ? await Service.getCategories({activeOnly:false}) : kind==='classes' ? await Service.getClasses({activeOnly:false}) : await Service.getSubjects({activeOnly:false});
    renderRows();
  }
  qs('#add-tax-btn').addEventListener('click', ()=>openTaxForm(kind, singular, null, classesForSubject, refresh));
  renderRows();
}
async function taxUpdate(kind,id,payload){ try{ if(kind==='categories') await Service.adminUpdateCategory(id,payload); else if(kind==='classes') await Service.adminUpdateClass(id,payload); else await Service.adminUpdateSubject(id,payload); toast('Updated.','success'); }catch(e){toast(friendlyError(e),'error');} }
async function taxDelete(kind,id){ try{ if(kind==='categories') await Service.adminDeleteCategory(id); else if(kind==='classes') await Service.adminDeleteClass(id); else await Service.adminDeleteSubject(id); toast('Deleted.','success'); }catch(e){toast(friendlyError(e),'error');} }
function openTaxForm(kind, singular, existing, classesForSubject, onDone){
  const item = existing || {};
  const box = openModal({ title:(existing?'Edit ':'Add ')+singular, bodyHTML:`
    <form id="tax-form">
      <div class="field"><label>Name</label><input id="tf-name" required value="${escapeHTML(item.name||'')}"></div>
      ${kind==='subjects' ? `<div class="field"><label>Subject Scope</label><div class="field-hint">This subject is global and will be available for every class.</div></div>` : ''}
      <div class="checkbox-row" style="margin-bottom:16px"><input type="checkbox" id="tf-active" ${existing?(item.is_active?'checked':''):'checked'}><label for="tf-active" style="margin:0">Active</label></div>
      <button class="btn btn-primary btn-block" type="submit">${existing?'Save Changes':'Create'}</button>
    </form>
  `});
  qs('#tax-form',box).addEventListener('submit', async e => {
    e.preventDefault();
    const name = qs('#tf-name',box).value.trim();
    const payload = { name, slug: slugify(name), is_active: qs('#tf-active',box).checked };
    if(kind==='subjects') payload.class_id = null;
    try{
      if(kind==='subjects'){
        const allSubjects = await Service.getSubjects({activeOnly:false});
        const duplicate = allSubjects.find(s =>
          s.id !== existing?.id &&
          String(s.name||'').trim().toLowerCase() === name.toLowerCase()
        );
        if(duplicate){
          toast('This subject already exists. Use the existing global subject for any class.','warning');
          return;
        }
      }
      if(existing){
        if(kind==='categories') await Service.adminUpdateCategory(existing.id,payload);
        else if(kind==='classes') await Service.adminUpdateClass(existing.id,payload);
        else await Service.adminUpdateSubject(existing.id,payload);
      } else {
        if(kind==='categories') await Service.adminCreateCategory(payload);
        else if(kind==='classes') await Service.adminCreateClass(payload);
        else await Service.adminCreateSubject(payload);
      }
      toast(existing?'Saved.':'Created.','success');
      closeModal(); onDone();
    }catch(err){ toast(friendlyError(err),'error'); }
  });
}

        <div class="field"><label>Correct Answer</label><select id="qf-correct"><option value="a" ${q.correct_answer==='a'?'selected':''}>A</option><option value="b" ${q.correct_answer==='b'?'selected':''}>B</option><option value="c" ${q.correct_answer==='c'?'selected':''}>C</option><option value="d" ${q.correct_answer==='d'?'selected':''}>D</option></select></div>
        <div class="field"><label>Difficulty</label><select id="qf-diff"><option value="easy" ${q.difficulty==='easy'?'selected':''}>Easy</option><option value="medium" ${!q.difficulty||q.difficulty==='medium'?'selected':''}>Medium</option><option value="hard" ${q.difficulty==='hard'?'selected':''}>Hard</option></select></div>
        <div class="field"><label>Marks</label><input id="qf-marks" type="number" value="${q.marks||1}"></div>
        <div class="field"><label>Negative Marks</label><input id="qf-neg" type="number" step="0.25" value="${q.negative_marks||0}"></div>
      </div>
      <div class="field"><label>Explanation (optional)</label><textarea id="qf-exp">${escapeHTML(q.explanation||'')}</textarea></div>
      <button class="btn btn-primary btn-block" type="submit">${existing?'Save Changes':'Add Question'}</button>
    </form>
  `});
  qs('#qf-form',box).addEventListener('submit', async e => {
    e.preventDefault();
    const payload = { test_id: test.id, question: qs('#qf-question',box).value.trim(), option_a: qs('#qf-a',box).value.trim(), option_b: qs('#qf-b',box).value.trim(), option_c: qs('#qf-c',box).value.trim()||null, option_d: qs('#qf-d',box).value.trim()||null, correct_answer: qs('#qf-correct',box).value, difficulty: qs('#qf-diff',box).value, marks: parseFloat(qs('#qf-marks',box).value)||1, negative_marks: parseFloat(qs('#qf-neg',box).value)||0, explanation: qs('#qf-exp',box).value.trim()||null };
    try{
      if(existing) await Service.adminUpdateQuestion(existing.id, payload); else await Service.adminCreateQuestion(payload);
      toast(existing?'Saved.':'Question added.','success'); onDone();
    }catch(err){ toast(friendlyError(err),'error'); }
  });
}

/* ----------------------------------------------------------------
   SUPABASE DIAGNOSTICS
   ---------------------------------------------------------------- */
window.EducationPointSupabase = {
  async connect(){ return ensureSupabaseClient(); },
  get ready(){ return SUPABASE_READY; },
  load: ensureSupabaseClient,
  get error(){ return SUPABASE_INIT_ERROR; },
  get client(){ return supabase; },
  async test(){
    if(!SUPABASE_READY) return {ok:false,error:SUPABASE_INIT_ERROR || 'SDK unavailable'};
    try{
      const {data,error}=await supabase.auth.getSession();
      return error ? {ok:false,error:error.message} :
        {ok:true,authenticated:!!data.session,email:data.session?.user?.email||null};
    }catch(e){
      return {ok:false,error:e?.message||String(e)};
    }
  }
}

/* ----------------------------------------------------------------
   10. APP BOOTSTRAP & ROUTE REGISTRATION
   ---------------------------------------------------------------- */
function wireStandardRoutes(){
  Router.add('/', () => { renderShell(); renderHome(); });
  Router.add('/search', (p, sp) => { renderShell(); renderSearchPage(sp); });
  Router.add('/tests', () => { renderShell(); renderTestList(); });
  Router.add('/take-test/:id', (p) => { renderShell(); renderTakeTest(p.id); });
  Router.add('/test-result/:id', (p) => { renderShell(); renderTestResult(p.id); });
  Router.add('/courses', () => { renderShell(); renderCourses(); });
  Router.add('/announcements', () => { renderShell(); renderAnnouncementsPage(); });
  Router.add('/dashboard', (p) => { renderShell(); renderDashboard(p,'overview'); });
  Router.add('/resource/:slug', (p) => { renderShell(); renderResourceDetail(p.slug); });
  Router.add('/category/:slug', (p) => { renderShell(); renderCategorySection(p.slug); });
  Router.add('/about', () => { renderShell(); renderStaticPage('about'); });
  Router.add('/contact', () => { renderShell(); renderStaticPage('contact'); });
  Router.add('/privacy', () => { renderShell(); renderStaticPage('privacy'); });
  Router.add('/terms', () => { renderShell(); renderStaticPage('terms'); });
  Router.add('/copyright-policy', () => { renderShell(); renderStaticPage('copyright-policy'); });
  Router.add('/copyright', () => { renderShell(); renderStaticPage('copyright'); });
  Router.add('/disclaimer', () => { renderShell(); renderStaticPage('disclaimer'); });
  Router.add('/admin', async () => {
    if(AppState.user && !AppState.isAdmin) await loadProfile();
    if(AppState.user && isSuperAdminEmail(AppState.user.email)) AppState.isAdmin = true;
    return renderAdminPanel({}, new URLSearchParams(), 'dashboard');
  });
  Router.add('/admin/:tab', async (p) => {
    if(AppState.user && !AppState.isAdmin) await loadProfile();
    return renderAdminPanel({}, new URLSearchParams(), p.tab);
  });

  // Every top-level content section supports Section → Class → Subject → Resource
  const sections = ['notes','guess-papers','preparation','keybooks','past-papers','pairing-schemes','mcqs','mdcat','ecat','paf','army-pma','other-entry-tests'];
  sections.forEach(sec => {
    Router.add(`/${sec}`, () => { renderShell(); renderCategorySection(sec); });
    Router.add(`/${sec}/:cls`, (p) => { renderShell(); renderClassSection(sec, p.cls); });
    Router.add(`/${sec}/:cls/:subject`, (p) => { renderShell(); renderResourceList(sec, p.cls, p.subject); });
  });
}

async function bootstrap(){
  const root = document.getElementById('app-root');
  if(!root) return;

  // Always paint the application first. A slow/blocked Supabase request
  // must never leave the user on a white screen.
  root.innerHTML = `<div class="boot-screen"><div class="boot-mark">EP</div></div>`;

  try{
    wireStandardRoutes();
    renderShell();
    Router.init();
  }catch(e){
    console.error('[Education Point] Initial UI render failed:', e);
    root.innerHTML = `
      <div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f7;font-family:Inter,system-ui,sans-serif">
        <div style="max-width:560px;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:24px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.12)">
          <h1 style="margin-bottom:10px">Education Point</h1>
          <p style="color:#666;margin-bottom:18px">The interface could not start. Open the browser console for the exact error.</p>
          <button onclick="location.reload()" style="border:0;border-radius:12px;padding:12px 18px;background:#111;color:#fff;cursor:pointer">Reload</button>
        </div>
      </div>`;
    return;
  }

  // Supabase work starts only AFTER the UI has been painted.
  // This prevents a CDN/network problem from ever producing a white screen.
  (async()=>{
    const connected = await ensureSupabaseClient();
    if(!connected){
      console.warn('[Education Point] Supabase is unavailable:', SUPABASE_INIT_ERROR);
      return;
    }

    try{
      AppState.siteSettings = await Promise.race([
        Service.getSiteSettings(),
        new Promise(resolve => setTimeout(()=>resolve({}), 5000))
      ]);
    }catch(e){
      AppState.siteSettings = {};
      console.warn('[Education Point] Site settings unavailable:', e);
    }

    try{
      await Promise.race([
        initAuth(),
        new Promise(resolve => setTimeout(resolve, 5000))
      ]);
    }catch(e){
      console.warn('[Education Point] Auth initialization unavailable:', e);
    }

    // If an already-authenticated owner opens the normal dashboard,
    // take them to the admin workspace instead of making them hunt for it.
    if(AppState.user && AppState.isAdmin && (Router.current === '/' || Router.current === '/dashboard')){
      go('/admin');
    }

    try{
      AppState.categories = await Promise.race([
        Service.getCategories(),
        new Promise(resolve => setTimeout(()=>resolve([]), 5000))
      ]);
      if(Router.current === '/') renderHomeBento();
    }catch(e){
      AppState.categories = [];
    }

    try{
      enableRealtimeUi();
      startRealtimeFeatures();
      registerRealtimeLifecycle();
    }catch(e){
      console.warn('[Education Point] Realtime initialization unavailable:', e);
    }
  })();

  window.addEventListener('online', () => toast('Back online.', 'success'));
  window.addEventListener('offline', () => toast('Connection lost. Some features may not work.', 'warning'));
}

document.addEventListener('DOMContentLoaded', bootstrap);
</script>
